  windowed:
    type: windowed
    events:
      - name: intermediate_pc1
        observable: pc1
        target_interval: [0.5154561400714434, 1.0154561400714432]
        physical_window: [9, 15]
    terminal_event: *terminal
    failure_guidance_weight: 1.0
  ordered:
    type: ordered
    allow_same_frame: false
    events:
      - name: contact_A
        observable: contact_A
        target_interval: [2.702696442604065, 1000.0]
        physical_window: [7, 15]
      - name: contact_B
        observable: contact_B
        target_interval: [0.0, 1.928276002407074]
        physical_window: [15, 21]
    terminal_event: *terminal
    failure_guidance_weight: 1.0

selection:
  source_catalog: data/duet/6j56_A_v2/duet_programs.yaml
  horizon_mapping: H16_to_H24_windows_only
  contact_pairs_frozen_from_R1_R2: true
