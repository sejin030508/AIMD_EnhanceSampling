design_split:
  task_design: [R1, R2]
  held_out_evaluation: [R3]

observables:
  pc1:
    kind: pc1
    pca_model: data/duet/6j56_A_v3/design_pca_r1_r2/pca_cv.npz
    component: 0
  contact_A:
    kind: residue_distance
    residue_i: 2
    residue_j: 72
