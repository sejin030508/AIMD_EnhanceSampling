# Route-v3.1 template. Copy once per protein and replace every <...> value.
# The preparation builder chooses physical_lag_in_10ps from the D1 first-passage
# time and writes the selected value into the generated main-run config.
project_root: ${DUET_PROJECT_ROOT}

model:
  backend: confrover
  repository_path: ${DUET_ASSET_ROOT}/external/ConfRover
  checkpoint: ${DUET_ASSET_ROOT}/data/confrover_cache/confrover_ckpts/confrover_base_20m_v1_0.pt
  cache_dir: ${DUET_ASSET_ROOT}/data/confrover_cache
  sampler_mode: sde
  physical_lag_in_10ps: 20
  reverse_steps: 200
  device: cuda:0
  dtype: float32

trajectory:
  case_id: <pdb_chain>
  seqres: <protein_sequence>
  horizon: <frozen_horizon>
  initial_structure: ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<initial_structure>.pdb
  initial_history: null

particles:
  outer_k: 16
  inner_m: 4
  inner_checkpoint_progress: 0.95
  outer_resampling: systematic
  outer_resampling_ess_fraction: 0.5
  inner_resampling: systematic

program:
  type: ordered
  failure_guidance_weight: 1.0
  potential_floor: 1.0e-30

reference:
  topology: ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<pdb_chain>.pdb
  # Replace these with the original ATLAS replicate files assigned to D1/D2/H.
  # D1 = replicate encoded by the official ConfRover case; D2 = lowest-index
  # remaining replicate; H = final remaining replicate.
  design_trajectories:
    - ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<d1_original_replicate_trajectory>.xtc
    - ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<d2_original_replicate_trajectory>.xtc
  design_labels: [D1, D2]
  held_out_trajectories:
    - ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<h_original_replicate_trajectory>.xtc
  held_out_labels: [H]
  held_out_trajectory: ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<h_original_replicate_trajectory>.xtc
  replicate_roles:
    D1: <R1_or_R2_or_R3_from_official_case>
    D2: <lowest_index_remaining_original_replicate>
    H: <final_remaining_original_replicate>
  initial_structure: ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<initial_structure>.pdb
  route_endpoint_structure: ${DUET_ASSET_ROOT}/data/atlas/<pdb_chain>/<route_endpoint_structure>.pdb
  protein_selection: protein and chainid 0
  stride: 10
  max_frames_per_trajectory: null
  n_components: 3
  basin_half_width: 0.25
  target_basin_half_width: 0.50

benchmark_protocol:
  version: route_v3_1
  transition_mode: last_exit_route_geometry
  route_discovery_role: D1
  route_discovery_trajectory_index: 0
  route_discovery_original_start_frame: <official_start_frame>
  route_discovery_original_end_frame: <official_end_frame>
  route_discovery_start_time_ps: <official_start_time_ps>
  route_discovery_end_time_ps: <official_end_time_ps>
  allow_first_eligible_discovery_fallback: false
  max_start_ca_rmsd_nm: 0.30
  reference_route_analysis_frames: 25
  reference_start_dwell_ps: 200.0
  reference_target_dwell_ps: 200.0
  reference_duration_gate: none
  lag_selection_mode: reference_first_passage_target_compression
  target_nominal_compression: 2.0
  model_lag_bounds_in_10ps: [20, 210]
  nominal_compression_factor: [1.0, 10.0]
  event_timing_mode: ordered_by_common_deadline
  generated_event_persistence_frames: 2
  generated_target_persistence_frames: 2
  allow_same_frame_stage_completion: false
  terminal_mode: first_stable_hit_by_deadline
  record_time_to_success: true
  held_out_role: optional_secondary_fidelity
  nominal_time_only: true
  physical_kinetics_claim: false

trajectory_horizon: <frozen_horizon>
contact_selection:
  min_sequence_separation: 5
  min_change_nm: 0.15
  min_initial_margin_nm: 0.15
  threshold_statistic: discovery_route_midpoint
  reference_crossing_persistence: 2
  min_event_support_count: 1
  min_route_support_count: 1

output:
  directory: ${DUET_PROJECT_ROOT}/data/duet/<pdb_chain>_route_v3_1

experiment:
  methods: [frozen, outer_only, inner_only, complete_nested, duet]
  decoder_population_budget: 64
  method_settings:
    frozen: {outer_k: 64, inner_m: 1}
    outer_only: {outer_k: 64, inner_m: 1}
    inner_only: {outer_k: 1, inner_m: 64}
    complete_nested: {outer_k: 16, inner_m: 4}
    duet: {outer_k: 16, inner_m: 4}
  tasks: [endpoint, ordered]
  task_count: 2
  seeds: [<program_setup_seed>]
  output_directory: outputs/duet_md/protein_benchmark/route_v3_1/<pdb_chain>/program_setup
  reference_split: D1_D2_design_H_optional_secondary
